<script>
let coins=250,luck=0,speed=1,multi=1,rebirth=0,total=0,rolling=false,owned=[];
const T=[["Common",650000,"common",2],["Uncommon",180000,"uncommon",8],["Rare",90000,"rare",25],["Epic",45000,"epic",80],["Legendary",22000,"legendary",250],["Mythic",9000,"mythic",700],["Divine",3000,"divine",2000],["Celestial",1000,"celestial",6000],["Transcendent",450,"transcendent",18000],["Cosmic",200,"cosmic",50000],["Eternal",90,"eternal",150000],["Void",45,"void",500000],["SECRET",14,"secret",2000000],["ADMIN",1,"admin",10000000]];

const f=n=>Math.floor(n).toLocaleString("id-ID"),cost=()=>Math.floor(5000*Math.pow(2.35,rebirth));
function render(){coins=Math.max(0,coins);coinsEl.textContent=f(coins);luckEl.textContent=luck.toFixed(0);speedEl.textContent=speed.toFixed(2);rebirthEl.textContent=rebirth;multiEl.textContent=multi.toFixed(2);
items.innerHTML=I.map((a,i)=>`<div class=item><span><b>${a[0]}</b><br><small>+${a[2]} ${a[3]=="luck"?"% Luck":a[3]=="multi"?"Multi":"Speed"} • ${f(a[1])} coins</small></span><button onclick="buy(${i})">${owned.includes(i)?"✓":"BUY"}</button></div>`).join("");
collection.innerHTML=T.map(t=>`<div class="${t[2]} line"><span>${t[0]}</span><b>${localStorage.getItem("lr"+t[0])||0}</b></div>`).join("");let c=cost();fill.style.width=Math.min(100,coins/c*100)+"%";rt.textContent=f(coins)+" / "+f(c)+" coins";}
function buy(i){if(owned.includes(i))return msg("Item sudah dimiliki");let a=I[i];if(coins<a[1])return msg("Coins tidak cukup");coins-=a[1];owned.push(i);if(a[3]=="luck")luck+=a[2];if(a[3]=="multi")multi+=a[2];if(a[3]=="speed")speed+=a[2];render();msg(a[0]+" aktif!")}
function up(t){let c=t=="multi"?100:60;if(coins<c)return msg("Coins tidak cukup");coins-=c;if(t=="luck")luck+=5;if(t=="speed")speed=Math.min(6,speed+.15);if(t=="multi")multi+=.05;render()}
function setR(t){result.className="result "+t[2];result.textContent=t[0]}
function roll(){if(rolling)return;rolling=true;rollBtn.disabled=true;let d=Math.max(100,800/speed),s=setInterval(()=>setR(T[Math.floor(Math.random()*T.length)]),55);setTimeout(()=>{clearInterval(s);finalRoll();rolling=false;rollBtn.disabled=false},d)}
function finalRoll(){total++;let r=Math.random()*1e6/((1+luck/100)*(1+rebirth*.25)),a=0,t=T[0];for(const q of T){a+=q[1];if(r<=a){t=q;break}}let gain=Math.floor(t[3]*multi*(1+rebirth*.1));coins+=gain;let k="lr"+t[0];localStorage.setItem(k,(+localStorage.getItem(k)||0)+1);setR(t);detail.textContent=`+${f(gain)} coins • Roll #${total} • Rebirth +${rebirth*25}% Luck`;log.innerHTML=`<div class="${t[2]}">🍀 <b>${t[0]}</b> → +${f(gain)}</div>`+log.innerHTML;render()}

const coinsEl=document.getElementById("coins"),luckEl=document.getElementById("luck"),speedEl=document.getElementById("speed"),rebirthEl=document.getElementById("rebirth"),multiEl=document.getElementById("multi"),items=document.getElementById("items"),collection=document.getElementById("collection"),fill=document.getElementById("fill"),rt=document.getElementById("rt"),result=document.getElementById("result"),detail=document.getElementById("detail"),log=document.getElementById("log"),rollBtn=document.getElementById("roll"),modal=document.getElementById("modal"),info=document.getElementById("info");render();
